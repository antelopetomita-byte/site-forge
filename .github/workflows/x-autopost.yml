name: X auto-post
on:
  schedule:
    - cron: "3 10 * * *"   # 毎日 19:03 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests-oauthlib
      - name: Post today's entry
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/x_post.py
      - name: Record posted state
        run: |
          git config user.name "no-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/x-posts.json
          git diff --cached --quiet || git commit -m "chore: mark today's X post as posted"
          git push
